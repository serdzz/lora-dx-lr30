[package]
name = "lora-dx-lr30-range-test"
version = "0.1.0"
edition = "2021"
description = "LoRa range test for two DX-SMART DX-LR30 (SX1278) modules on STM32F103C8 BluePill"
license = "MIT OR Apache-2.0"

[lib]
name = "lora_dx_lr30"
path = "src/lib.rs"

[[bin]]
name = "node_a"
path = "src/bin/node_a.rs"

[[bin]]
name = "node_b"
path = "src/bin/node_b.rs"

[dependencies]
embassy-executor = { version = "0.6", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
    "integrated-timers",
] }
embassy-stm32 = { version = "0.1", features = [
    "defmt",
    "stm32f103c8",
    "memory-x",
    "time-driver-tim2",
    "unstable-pac",
    "exti",
] }
embassy-time = { version = "0.3", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-sync = "0.6"

embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.2", features = ["async"] }

lora-phy = { version = "3", default-features = false }

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-futures = "0.1"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 1
overflow-checks = true
