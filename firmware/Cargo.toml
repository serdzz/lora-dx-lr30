[package]
name = "lora-dx-lr30-range-test"
version = "0.1.0"
edition = "2021"
description = "LoRa range test for two DX-SMART DX-LR30 (SX1262) modules on STM32F103C8T6 BluePill"
license = "MIT"

[lib]
name = "lora_dx_lr30"
path = "src/lib.rs"

[[bin]]
name = "node_a"
path = "src/bin/node_a.rs"

[[bin]]
name = "node_b"
path = "src/bin/node_b.rs"

[[bin]]
name = "repeater"
path = "src/bin/repeater.rs"

[dependencies]
swap-common = { path = "../swap-common" }
# serdzz/embassy fork, branch dev/stm32f1-deep-sleep: embassy-stm32 0.6 with
# STM32F1 STOP-mode (low-power) support. All embassy crates must come from the
# same source so internal deps (embassy-time-driver etc.) resolve to one version.
embassy-executor = { git = "https://github.com/serdzz/embassy.git", branch = "dev/stm32f1-deep-sleep", features = [
    "defmt",
] }
embassy-stm32 = { git = "https://github.com/serdzz/embassy.git", branch = "dev/stm32f1-deep-sleep", features = [
    "defmt",
    "stm32f103c8",
    "time-driver-tim2",
    "unstable-pac",
    "exti",
] }
embassy-time = { git = "https://github.com/serdzz/embassy.git", branch = "dev/stm32f1-deep-sleep", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-sync = { git = "https://github.com/serdzz/embassy.git", branch = "dev/stm32f1-deep-sleep" }

embedded-hal-async = "1.0"
embedded-hal-bus = { version = "0.2", features = ["async"] }

lora-phy = { version = "3", default-features = false }

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-futures = "0.1"
heapless = "0.8"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 1
overflow-checks = true
